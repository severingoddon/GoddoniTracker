# Fixed project name: images, network and volume names must not depend on the folder name
name: goddonitracker

services:
  backend:
    build: ./backend
    container_name: goddonitracker-backend
    volumes:
      - db-data:/app/data
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      - DATA_DIR=/app/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: goddonitracker-nginx
    ports:
      - "3004:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/pi/GoddoniTracker/Certs:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
    name: goddonitracker_db-data
