---
- name: Deploy GoddoniTracker to Raspi
  hosts: raspi
  vars:
    project_dir: ~/GoddoniTracker/GoddoniTracker
    repo_url: https://github.com/severingoddon/GoddoniTracker.git

  tasks:
    - name: Clone repo if not present
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: main
      register: git_clone
      ignore_errors: true

    - name: Pull latest code
      ansible.builtin.command: git pull
      args:
        chdir: "{{ project_dir }}"
      when: git_clone is failed

    - name: Stop containers
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        state: absent

    - name: Remove GoddoniTracker images
      ansible.builtin.shell: docker images --filter "reference=*goddonitracker*" -q | xargs -r docker rmi -f 2>/dev/null || true
      changed_when: false

    - name: Remove GoddoniTracker volumes
      ansible.builtin.shell: docker volume ls -q --filter "name=goddonitracker" | xargs -r docker volume rm 2>/dev/null || true
      changed_when: false

    - name: Build from scratch
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        build: always
        state: present
      environment:
        COMPOSE_DOCKER_CLI_BUILD: "1"
        DOCKER_BUILDKIT: "1"

    - name: Wait for startup
      ansible.builtin.pause:
        seconds: 5

    - name: Show backend logs
      ansible.builtin.command: docker logs goddonitracker-backend --tail 20
      register: backend_logs
      changed_when: false

    - name: Print backend logs
      ansible.builtin.debug:
        var: backend_logs.stdout_lines
